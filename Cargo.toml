[package]
name = "refim"
version = "0.1.0"
edition = "2024"

[dependencies]
glium = "0.35.0"
image = "0.25.6"
imgui = { version = "0.12.0", features = ["docking"] }
imgui-glium-renderer = "0.13.0"
imgui-winit-support = "0.13.0"
nokhwa = { version = "0.10.7", features = ["input-opencv"] }
scopeguard = "1.2.0"

[profile.dev.package.imgui]
opt-level = 2
debug-assertions = false
